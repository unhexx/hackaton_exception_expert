# Стенд прототипа ФСП.
name: fsp-vacancies

services:
  app:
    image: fsp-vacancies:local
    build:
      context: ../..
      dockerfile: deploy/fsp/Dockerfile
    env_file:
      - path: compose.env
        required: false
    environment:
      PRODUCT_SQLITE: /data/app.sqlite
      PRODUCT_COOKIE_SECURE: "0"
      PRODUCT_SECRET_FILE: /data/product_secret
      OIDC_ISSUER: ${OIDC_ISSUER:-http://127.0.0.1:8080/realms/fsp}
      OIDC_INTERNAL_ISSUER: ${OIDC_INTERNAL_ISSUER:-http://keycloak:8080/realms/fsp}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-fsp-vacancies}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - fsp-sqlite:/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1g
    volumes:
      - ./fsp-realm.json:/opt/keycloak/data/import/fsp-realm.json:ro
    restart: unless-stopped

  tests:
    image: fsp-vacancies:local
    profiles: ["test"]
    build:
      context: ../..
      dockerfile: deploy/fsp/Dockerfile
    environment:
      PRODUCT_SECRET: "test-secret-32-characters-minimum!!"
      PRODUCT_COOKIE_SECURE: "0"
      PRODUCT_BADGE_DIR: /badge
    volumes:
      - ../../product/docs/badges:/badge
    entrypoint: ["pytest", "product/tests", "-q", "--tb=short"]

volumes:
  fsp-sqlite:
