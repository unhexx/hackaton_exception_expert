{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block body %}
<h1>Регистрация</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/auth/register">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="email">Почта</label>
  <input id="email" name="email" type="email" required>
  <label for="password">Пароль</label>
  <input id="password" name="password" type="password" required minlength="8">
  <div class="row">
    <label><input type="radio" name="role" value="candidate" checked> Соискатель</label>
    <label><input type="radio" name="role" value="employer"> Работодатель</label>
  </div>
  <label><input type="checkbox" name="consent" value="1"> Согласие на обработку и публикацию профиля</label>
  <p><button type="submit">Создать учётную запись</button></p>
</form>
<p><a href="/auth/login">Уже есть вход</a></p>
{% endblock %}
